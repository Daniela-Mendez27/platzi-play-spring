server.port=8090


# Spring Data JPA
spring.datasource.url=jdbc:postgresql://localhost:5432/platzi-play_db
spring.datasource.username=dani
spring.datasource.password=2727

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring-jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always



# Configuración de LangChain4j (IA)
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo}
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# Logs corregidos
logging.level.org.springframework.boot.docker.compose=DEBUG
logging.level.dev.langchain4j=DEBUG