server.port=8080

# Conexión Base a PostgreSQL Local (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/platzi-play_db
spring.datasource.username=dani
spring.datasource.password=dani1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización por Script (Tu archivo data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql