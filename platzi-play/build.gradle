plugins {
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
}

group = 'com.platzi_play'
version = '1.0.0'

repositories {
	mavenCentral() // Esto es vital para que Gradle sepa de dónde bajar las librerías
}

dependencies {
	// Web starter (incluye Tomcat y Spring MVC automáticamente)
	implementation 'org.springframework.boot:spring-boot-starter-web'


	//Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// LangChain4j con el BOM para gestionar versiones automáticamente
	implementation platform('dev.langchain4j:langchain4j-bom:0.36.2')
	implementation 'dev.langchain4j:langchain4j-open-ai-spring-boot-starter'

	implementation 'dev.langchain4j:langchain4j-spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'


///////MAPSTRUCT
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	//documentación doc OpenApi
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'


	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}